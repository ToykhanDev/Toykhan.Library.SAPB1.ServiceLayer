name: Publish GitHub Packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

env:
  PACKAGE_PROJECT: Toykhan.Library.SapB1.ServiceLayer.csproj
  PACKAGE_OUTPUT: artifacts/nuget
  GITHUB_PACKAGES_SOURCE: https://nuget.pkg.github.com/ToykhanDev/index.json

jobs:
  publish:
    name: Pack and publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore "$PACKAGE_PROJECT"

      - name: Build
        run: dotnet build "$PACKAGE_PROJECT" --configuration Release --no-restore

      - name: Pack
        run: dotnet pack "$PACKAGE_PROJECT" --configuration Release --no-build --output "$PACKAGE_OUTPUT"

      - name: Add GitHub Packages source
        run: dotnet nuget add source "$GITHUB_PACKAGES_SOURCE" --name github --username "${{ github.actor }}" --password "${{ secrets.GITHUB_TOKEN }}" --store-password-in-clear-text

      - name: Publish
        shell: bash
        run: |
          for package in "$PACKAGE_OUTPUT"/*.nupkg; do
            dotnet nuget push "$package" --source github --api-key "${{ secrets.GITHUB_TOKEN }}" --skip-duplicate
          done
